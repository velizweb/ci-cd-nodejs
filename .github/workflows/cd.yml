name: CD Pipeline

on:
  workflow_run:
    workflow: [ "CI Pipeline" ]
    type:
      - completed 

jobs:

  build:
    runs-on: self-hosted
    steps:
      - name: Pull image fron Docker Hub
        run: docker pull velizweb/cicd-pipeline:latest
      - name: Delete old container
        run: docker rm -f cicd-pipeline-container
      - name: Run docker container
        run: docker run -d -p 8080:8080 --name cicd-pipeline-container velizweb/cicd-pipeline